name: Documentation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/evals/
            !/studies/
            /evals/context-retention/
            /studies/*/RESULTS.md
            /studies/ema-schedule/figures/
            /studies/ema-schedule/publications/reference-r2/
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: npm ci
        working-directory: site
      - run: npm audit --audit-level=high
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: npm test
        working-directory: site
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docs-validation
          path: site/test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: documentation-preview
          path: site/dist/
          retention-days: 14
