name: External documentation links
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 1 * *'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/evals/
            !/studies/
            /evals/context-retention/
            /studies/*/RESULTS.md
            /studies/ema-schedule/figures/
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: npm ci && npm run build
        working-directory: site
      - run: python3 tools/check_external_links.py --site site/dist --output build/external-links.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: external-link-report
          path: build/external-links.json
          retention-days: 30
