<circle data-seed="117" data-difference="0.109375" cx="662.500" cy="440.000" r="4" fill="#0072b2"/>
<text x="85" y="464.000" text-anchor="end" font-size="12">118</text>
<circle data-seed="118" data-difference="-0.03125" cx="343.750" cy="460.000" r="4" fill="#c45100"/>
<text x="85" y="484.000" text-anchor="end" font-size="12">119</text>
<circle data-seed="119" data-difference="0.046875" cx="520.833" cy="480.000" r="4" fill="#0072b2"/>
<text x="85" y="504.000" text-anchor="end" font-size="12">120</text>
<circle data-seed="120" data-difference="0.140625" cx="733.333" cy="500.000" r="4" fill="#0072b2"/>
