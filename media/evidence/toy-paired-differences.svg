<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 640" role="img" aria-labelledby="title description">
<title id="title">Paired squared-error differences by confirmation seed</title>
<desc id="description">Positive differences favor the sample mean. The dashed line is the across-seed mean; the solid vertical line is zero.</desc>
<rect width="840" height="640" fill="white"/>
<g font-family="sans-serif" fill="#172b3a">
<text x="30" y="32" font-size="20">Paired squared-error differences</text>
<text x="30" y="56" font-size="13">One dot per confirmation seed; dashed line: mean difference</text>
<text x="30" y="80" font-size="12">Seed</text>
<line x1="110.000" x2="110.000" y1="90" y2="570" stroke="#e2e8ee"/>
<text x="110.000" y="596" text-anchor="middle" font-size="12">-0.134</text>
<line x1="246.000" x2="246.000" y1="90" y2="570" stroke="#e2e8ee"/>
<text x="246.000" y="596" text-anchor="middle" font-size="12">-0.074</text>
<line x1="382.000" x2="382.000" y1="90" y2="570" stroke="#e2e8ee"/>
<text x="382.000" y="596" text-anchor="middle" font-size="12">-0.014</text>
<line x1="518.000" x2="518.000" y1="90" y2="570" stroke="#e2e8ee"/>
<text x="518.000" y="596" text-anchor="middle" font-size="12">0.046</text>
<line x1="654.000" x2="654.000" y1="90" y2="570" stroke="#e2e8ee"/>
<text x="654.000" y="596" text-anchor="middle" font-size="12">0.106</text>
<line x1="790.000" x2="790.000" y1="90" y2="570" stroke="#e2e8ee"/>
<text x="790.000" y="596" text-anchor="middle" font-size="12">0.166</text>
<line x1="414.583" x2="414.583" y1="90" y2="570" stroke="#526777"/>
<line x1="562.153" x2="562.153" y1="90" y2="570" stroke="#172b3a" stroke-dasharray="5 4"/>
<text x="85" y="104.000" text-anchor="end" font-size="12">100</text>
<circle data-seed="100" data-difference="0.0625" cx="556.250" cy="100.000" r="4" fill="#0072b2"/>
<text x="85" y="124.000" text-anchor="end" font-size="12">101</text>
<circle data-seed="101" data-difference="0.109375" cx="662.500" cy="120.000" r="4" fill="#0072b2"/>
<text x="85" y="144.000" text-anchor="end" font-size="12">102</text>
<circle data-seed="102" data-difference="0.0625" cx="556.250" cy="140.000" r="4" fill="#0072b2"/>
