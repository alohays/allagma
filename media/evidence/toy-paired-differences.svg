<circle data-seed="121" data-difference="0" cx="414.583" cy="520.000" r="4" fill="#c45100"/>
<text x="85" y="544.000" text-anchor="end" font-size="12">122</text>
<circle data-seed="122" data-difference="0.109375" cx="662.500" cy="540.000" r="4" fill="#0072b2"/>
<text x="85" y="564.000" text-anchor="end" font-size="12">123</text>
<circle data-seed="123" data-difference="0.09375" cx="627.083" cy="560.000" r="4" fill="#0072b2"/>
<text x="450" y="625" text-anchor="middle" font-size="13">Squared error: biased estimator − sample mean</text>
