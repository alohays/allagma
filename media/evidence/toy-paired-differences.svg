<circle data-seed="115" data-difference="0.03125" cx="485.417" cy="400.000" r="4" fill="#0072b2"/>
<text x="85" y="424.000" text-anchor="end" font-size="12">116</text>
<circle data-seed="116" data-difference="0.140625" cx="733.333" cy="420.000" r="4" fill="#0072b2"/>
