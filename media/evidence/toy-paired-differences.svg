<circle data-seed="104" data-difference="-0.109375" cx="166.667" cy="180.000" r="4" fill="#c45100"/>
<text x="85" y="204.000" text-anchor="end" font-size="12">105</text>
<circle data-seed="105" data-difference="0.125" cx="697.917" cy="200.000" r="4" fill="#0072b2"/>
<text x="85" y="224.000" text-anchor="end" font-size="12">106</text>
