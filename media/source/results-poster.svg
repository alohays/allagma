<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>The offline study produces a paired-difference figure and a report that explains its findings and counterexamples.</title><rect width="1280" height="720" fill="#f5f7ef"/><g font-family="Arial,Helvetica,sans-serif" fill="#173b31"><text x="40" y="43" font-size="18" letter-spacing="1.8" fill="#376c5d">ALLAGMA / THE OFFLINE EXAMPLE</text><text x="40" y="94" font-size="42" font-weight="600">A figure and a report you can inspect</text><rect x="40" y="124" width="630" height="480" rx="7" fill="#fff" stroke="#cad6cd"/><image href="data:image/svg+xml;base64," x="53" y="137" width="604" height="454"/><rect x="696" y="124" width="544" height="480" rx="7" fill="#fff" stroke="#cad6cd"/><text x="726" y="167" font-size="18" fill="#376c5d">FROM THE GENERATED MANUSCRIPT</text><text x="726" y="211" font-size="30" font-weight="600">The average error increased.</text><text x="726" y="264" font-size="26">The biased estimator had higher</text><text x="726" y="300" font-size="26">average squared error across 24</text><text x="726" y="336" font-size="26">confirmation seeds.</text><path d="M726 378H1210" stroke="#cad6cd"/><text x="726" y="420" font-size="25" font-weight="600">But not on every seed.</text><text x="726" y="458" font-size="24">The report identifies four</text><text x="726" y="492" font-size="24">counterexamples to that claim.</text><text x="726" y="557" font-size="19" fill="#52665c">24 seeds · known-answer study</text><text x="40" y="679" font-size="20" fill="#52665c">Actual retained outputs. Full-size figure and report linked below the player.</text></g></svg>