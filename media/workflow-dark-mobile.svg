<svg xmlns="http://www.w3.org/2000/svg" width="600" height="670" viewBox="0 0 600 670" role="img"><title>You supply the question and limits. The agent plans, runs and analyzes the study. You review figures, report and reproducible code.</title><rect width="600" height="670" rx="14" fill="#102427"/><g font-family="Arial,Helvetica,sans-serif" fill="#f1f5eb"><text x="28" y="40" font-size="15" letter-spacing="1.4" fill="#77dfc5">ALLAGMA / HOW THE STUDY GETS DONE</text><text x="28" y="89" font-size="32" font-weight="600">A research question becomes</text><text x="28" y="130" font-size="32" font-weight="600">work you can inspect.</text><rect x="28" y="157" width="544" height="96" rx="6" fill="#183438" stroke="#b4c4c2" stroke-opacity=".3"/><text x="45" y="183" font-size="14" fill="#77dfc5">01 / YOU SUPPLY</text><text x="45" y="219" font-size="26" font-weight="600">Question</text><text x="302" y="199" font-size="19" fill="#b4c4c2">Brief, sources</text><text x="302" y="225" font-size="19" fill="#b4c4c2">and resource limits</text><rect x="28" y="269" width="544" height="96" rx="6" fill="#183438" stroke="#b4c4c2" stroke-opacity=".3"/><text x="45" y="295" font-size="14" fill="#77dfc5">02 / AGENT PLANS</text><text x="45" y="331" font-size="26" font-weight="600">Protocol + code</text><text x="302" y="311" font-size="19" fill="#b4c4c2">Comparisons</text><text x="302" y="337" font-size="19" fill="#b4c4c2">and feasibility checks</text><rect x="28" y="381" width="544" height="96" rx="6" fill="#183438" stroke="#b4c4c2" stroke-opacity=".3"/><text x="45" y="407" font-size="14" fill="#77dfc5">03 / AGENT RUNS</text><text x="45" y="443" font-size="26" font-weight="600">Runs + analysis</text><text x="302" y="423" font-size="19" fill="#b4c4c2">Experiments, recovery</text><text x="302" y="449" font-size="19" fill="#b4c4c2">and interpretation</text><rect x="28" y="493" width="544" height="96" rx="6" fill="#183438" stroke="#b4c4c2" stroke-opacity=".3"/><text x="45" y="519" font-size="14" fill="#77dfc5">04 / YOU REVIEW</text><text x="45" y="555" font-size="26" font-weight="600">Figures + report</text><text x="302" y="535" font-size="19" fill="#b4c4c2">Findings, critique</text><text x="302" y="561" font-size="19" fill="#b4c4c2">and reproducible code</text><text x="28" y="652" font-size="15" fill="#b4c4c2">Allagma keeps the plan, attempts and evidence with the result.</text></g></svg>