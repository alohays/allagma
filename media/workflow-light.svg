<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="332" viewBox="0 0 1000 332" role="img"><title>You supply the question and limits. The agent plans, runs and analyzes the study. You review figures, report and reproducible code.</title><rect width="1000" height="332" rx="14" fill="#f7f8f2"/><g font-family="Arial,Helvetica,sans-serif" fill="#172e32"><text x="28" y="40" font-size="15" letter-spacing="1.4" fill="#087568">ALLAGMA / HOW THE STUDY GETS DONE</text><text x="28" y="92" font-size="35" font-weight="600">A research question becomes work you can inspect.</text><rect x="28" y="126" width="210" height="160" rx="6" fill="#ffffff" stroke="#506267" stroke-opacity=".3"/><text x="44" y="155" font-size="12" fill="#087568">01 / YOU SUPPLY</text><text x="44" y="196" font-size="23" font-weight="600">Question</text><text x="44" y="232" font-size="16" fill="#506267">Brief, sources</text><text x="44" y="257" font-size="16" fill="#506267">and resource limits</text><path d="M245 206h19m-6-6 6 6-6 6" fill="none" stroke="#087568" stroke-width="2"/><rect x="273" y="126" width="210" height="160" rx="6" fill="#ffffff" stroke="#506267" stroke-opacity=".3"/><text x="289" y="155" font-size="12" fill="#087568">02 / AGENT PLANS</text><text x="289" y="196" font-size="23" font-weight="600">Protocol + code</text><text x="289" y="232" font-size="16" fill="#506267">Comparisons</text><text x="289" y="257" font-size="16" fill="#506267">and feasibility checks</text><path d="M490 206h19m-6-6 6 6-6 6" fill="none" stroke="#087568" stroke-width="2"/><rect x="518" y="126" width="210" height="160" rx="6" fill="#ffffff" stroke="#506267" stroke-opacity=".3"/><text x="534" y="155" font-size="12" fill="#087568">03 / AGENT RUNS</text><text x="534" y="196" font-size="23" font-weight="600">Runs + analysis</text><text x="534" y="232" font-size="16" fill="#506267">Experiments, recovery</text><text x="534" y="257" font-size="16" fill="#506267">and interpretation</text><path d="M735 206h19m-6-6 6 6-6 6" fill="none" stroke="#087568" stroke-width="2"/><rect x="763" y="126" width="210" height="160" rx="6" fill="#ffffff" stroke="#506267" stroke-opacity=".3"/><text x="779" y="155" font-size="12" fill="#087568">04 / YOU REVIEW</text><text x="779" y="196" font-size="23" font-weight="600">Figures + report</text><text x="779" y="232" font-size="16" fill="#506267">Findings, critique</text><text x="779" y="257" font-size="16" fill="#506267">and reproducible code</text><text x="28" y="314" font-size="15" fill="#506267">Allagma keeps the plan, attempts and evidence with the result.</text></g></svg>